services:
  recipe-manager:
    build: .
    container_name: recipe-manager
    ports:
      - "3000:3000"
    volumes:
      - recipe-data:/data
    restart: unless-stopped
    environment:
      - DATABASE_URL=file:/data/recipes.db
      - UPLOAD_DIR=/data/uploads

volumes:
  recipe-data:
    driver: local
